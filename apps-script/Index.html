<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>간편장부</title>
<style>
:root{
  --income:#C0504D;--income-bg:#F9ECEB;--expense:#4F81BD;--expense-bg:#EDF2F8;--asset:#4BACC6;--asset-bg:#EAF6F9;
  --ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--head-line:#1F497D;--row-line:#4F81BD;--grid:#D9D9D9;--total-bg:#F3FAFB;
  --danger:#B42318;--warn-bg:#FFF4E5;--ok:#067647;--bg:#F7F8FA;--card:#fff;--radius:8px;--gap:12px;
  --font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 var(--font);color:var(--ink);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
h1{font-size:17px;margin:0}
h2{font-size:18px;margin:0 0 var(--gap)}
h3{font-size:15px;margin:0 0 8px}
.app{display:grid;grid-template-columns:180px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--head-line);color:#fff}
header label{margin-left:auto;display:flex;gap:6px;align-items:center}
header select{padding:4px 8px;border-radius:6px;border:0;background:#fff;color:var(--ink)}
nav{background:var(--card);border-right:1px solid var(--line);padding:12px 8px}
nav a{display:block;padding:9px 12px;border-radius:6px;color:var(--ink);text-decoration:none}
nav a:hover{background:var(--bg)}
nav a[aria-current="page"]{background:var(--expense-bg);color:var(--head-line);font-weight:600}
nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
main{padding:20px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--gap);margin-top:var(--gap)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.income{border-top:4px solid var(--income)} .card.expense{border-top:4px solid var(--expense)} .card.asset{border-top:4px solid var(--asset)}
.card.income h3{color:var(--income)} .card.expense h3{color:var(--expense)} .card.asset h3{color:var(--asset)}
.field{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.field>label{color:var(--muted);font-size:13px}
.field input,.field select,.toolbar input,.toolbar select{width:100%;padding:6px 8px;border:1px solid var(--grid);border-radius:6px;background:#fff;min-width:0}
.field input:focus,.field select:focus,.toolbar input:focus,.toolbar select:focus,button:focus-visible{outline:2px solid var(--expense);outline-offset:1px}
.field .err,.err{grid-column:2;color:var(--danger);font-size:12px;min-height:0}
[aria-invalid="true"]{border-color:var(--danger)!important}
.radios{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.radios label{display:flex;gap:4px;align-items:center;color:var(--ink);white-space:nowrap}
.radios input[inputmode]{flex:1 1 80px;min-width:70px;width:auto}
.total{text-align:right;font-weight:700;font-size:16px}
.note{color:var(--muted);font-size:12px;margin:6px 0 0}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--grid);background:#fff;cursor:pointer}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--head-line);border-color:var(--head-line);color:#fff}
.btn.danger{color:var(--danger);border-color:#F3C1BC}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:var(--gap)}
.toolbar>*{flex:0 0 auto}
.toolbar input[type=date]{width:145px}
.toolbar input[type=search]{width:180px}
.toolbar select{width:auto}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--grid);background:#fff;cursor:pointer;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:var(--gap)}
.tabs button[aria-pressed="true"]{background:var(--head-line);color:#fff;border-color:var(--head-line)}
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
table.data{border-collapse:collapse;width:100%;white-space:nowrap}
table.data th{background:#fff;position:sticky;top:0;border-bottom:2px solid var(--head-line);padding:7px 8px;text-align:left;font-weight:600;font-size:13px}
table.data td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
table.data tr.sum td{background:var(--total-bg);font-weight:700;border-top:1px solid var(--head-line)}
table.data tr.q td,table.data td.q{background:var(--total-bg)}
table.data tbody tr.click{cursor:pointer} table.data tbody tr.click:hover td{background:#F9FAFB}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.badge.INCOME{background:var(--income-bg);color:var(--income)} .badge.EXPENSE{background:var(--expense-bg);color:var(--expense)} .badge.ASSET{background:var(--asset-bg);color:#2C7A8E}
.up{color:var(--danger)} .down{color:var(--expense)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:8px}
.warn{background:var(--warn-bg);border:1px solid #F5C77E;border-radius:var(--radius);padding:10px 14px;margin-bottom:var(--gap)}
.warn a{color:var(--head-line)}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
.bars .q{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bars .cols{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.bars .cols span{width:14px;border-radius:3px 3px 0 0;min-height:1px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:12px;padding:20px;width:min(520px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(17,24,39,.4)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1} #toast.bad{background:var(--danger)}
.loading{color:var(--muted);padding:30px;text-align:center}
.colpick{display:flex;flex-wrap:wrap;gap:10px;padding:8px 0}
/* 서식(부표·계산서) */
.form-doc{background:#fff;max-width:820px;margin:0 auto;padding:24px 28px;border:1px solid var(--line)}
.form-doc .law{font-size:12px;margin:0 0 6px}
.form-doc .title{text-align:center;font-size:20px;font-weight:700;margin:6px 0 14px;letter-spacing:2px}
.form{border-collapse:collapse;width:100%;font-size:13px}
.form td,.form th{border:1px solid #000;padding:4px 6px;vertical-align:middle;font-weight:normal}
.form th{background:#F3F4F6;text-align:center}
.form td.amt{text-align:right;width:170px;font-variant-numeric:tabular-nums}
.form td.amt input{width:100%;text-align:right;border:1px dashed var(--expense);border-radius:4px;padding:2px 4px;background:var(--expense-bg)}
.form tr.tot td{font-weight:700}
.form .vert{writing-mode:vertical-rl;text-orientation:upright;text-align:center;letter-spacing:2px;width:34px}
.form-doc .foot{margin-top:14px;font-size:13px}
.form-doc .sign{display:grid;grid-template-columns:1fr auto auto;gap:8px 24px;justify-items:end;margin:14px 0}
@media (max-width:900px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;overflow-x:auto;padding:4px;border-right:0;border-top:1px solid var(--line)}
  nav a{white-space:nowrap;padding:8px 10px;font-size:13px} nav hr{display:none}
  main{padding:12px 12px 70px}
}
@page{size:A4 portrait;margin:12mm}
@media print{
  header,nav,.toolbar,.warn,.noprint,#toast{display:none!important}
  body,main{background:#fff;padding:0} .app{display:block}
  .form-doc{border:0;padding:0;max-width:none}
  .form td.amt input{border:0;background:none;padding:0}
  .form select{appearance:none;-webkit-appearance:none}
  .tablewrap{border:0;overflow:visible} table.data th{position:static}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>종합소득세 간편장부</h1>
    <label>귀속연도 <select id="year" aria-label="귀속연도"></select></label>
  </header>
  <nav aria-label="메뉴">
    <a href="#dashboard">대시보드</a>
    <a href="#records">내역관리</a>
    <a href="#partners">거래처</a>
    <hr>
    <a href="#byKind">거래별 현황</a>
    <a href="#byPartner">거래처별 현황</a>
    <a href="#monthly">월별 현황</a>
    <hr>
    <a href="#expense">명세서(부표)</a>
    <a href="#income">소득금액계산서</a>
    <hr>
    <a href="#settings">설정</a>
  </nav>
  <main id="view" tabindex="-1"><p class="loading">불러오는 중…</p></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ───────── 기본 도구 ───────── */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n || 0).toLocaleString('ko-KR');
const unfmt = s => String(s ?? '').replace(/[^\d]/g, '');
const pct = r => r == null ? '-' : `<span class="${r >= 0 ? 'up' : 'down'}">${r >= 0 ? '▲' : '▼'} ${(Math.abs(r) * 100).toFixed(1)}%</span>`;
const KIND = { INCOME: '수입', EXPENSE: '비용', ASSET: '고정자산매입' };
const KINDS = Object.keys(KIND);
const KCLS = { INCOME: 'income', EXPENSE: 'expense', ASSET: 'asset' };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
const store = {  // 브라우저 저장은 편의 기능일 뿐 — 실패해도 동작
  get(k, d) { try { const v = localStorage.getItem('gj.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('gj.' + k, JSON.stringify(v)); } catch (e) {} }
};

function call(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => r && r.ok ? resolve(r.data) : reject(r ? r.error : { code: 'INTERNAL', message: '응답이 없습니다.' }))
      .withFailureHandler(() => reject({ code: 'NETWORK', message: '서버에 연결하지 못했습니다. 다시 시도해 주세요.' }))
      .api(action, payload || {});
  });
}

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2600);
}
const fail = e => toast(e && e.message || '오류가 발생했습니다.', true);

/* ───────── 상태 ───────── */
const S = { boot: null, year: null };
const cats = kind => S.boot.categories.filter(c => c.kind === kind && c.isActive);
const yearRange = () => ({ from: S.year + '-01-01', to: S.year + '-12-31' });

async function boot() {
  try { S.boot = await call('init'); } catch (e) { $('#view').innerHTML = `<p class="loading">${esc(e.message)}</p>`; return; }
  const thisYear = Number(S.boot.today.slice(0, 4));
  S.year = store.get('year', thisYear);
  $('#year').innerHTML = Array.from({ length: thisYear - 2014 }, (_, i) => thisYear + 1 - i)
    .map(y => `<option ${y === S.year ? 'selected' : ''}>${y}</option>`).join('');
  $('#year').onchange = e => { S.year = Number(e.target.value); store.set('year', S.year); route(); };
  $('#dlg').addEventListener('click', e => { if (e.target.id === 'dlg') $('#dlg').close(); });
  window.onhashchange = route;
  route();
}
async function refreshBoot() { S.boot = await call('init'); }

const VIEWS = {};
function route() {
  const name = (location.hash || '#dashboard').slice(1);
  const view = VIEWS[name] ? name : 'dashboard';
  $$('nav a').forEach(a => a.getAttribute('href') === '#' + view ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#view').innerHTML = '<p class="loading">불러오는 중…</p>';
  VIEWS[view]($('#view')).catch(fail);
}

/* ───────── 공용: 거래 입력/수정 폼 ───────── */
function options(list, selected, blank) {
  return (blank ? `<option value="">${esc(blank)}</option>` : '') +
    list.map(v => `<option ${v === selected ? 'selected' : ''}>${esc(v)}</option>`).join('');
}
/** 거래처 자동완성 목록은 문서에 하나만 둔다. 템플릿 안에서 불러도 빈 문자열을 돌려준다. */
function partnerList() {
  let dl = $('#partnerList');
  if (!dl) { dl = document.createElement('datalist'); dl.id = 'partnerList'; document.body.append(dl); }
  dl.innerHTML = S.boot.partners.map(p => `<option value="${esc(p.name)}">`).join('');
  return '';
}

/** 거래 폼. tx가 있으면 수정, 없으면 kind로 새 입력. onDone(저장된 거래) */
function txForm(root, { kind, tx, onDone, compact }) {
  kind = tx ? tx.kind : kind;
  const id = 'f' + Math.random().toString(36).slice(2, 7);
  const mode = tx ? tx.vatMode : (S.boot.settings['vatDefault.' + kind] || 'NONE');
  let requestId = uuid();   // 이 폼에서 저장 1회 = 요청 번호 1개. 재시도에도 같은 값.
  root.innerHTML = `
    <form novalidate>
      ${field('date', '일자', `<input type="date" required value="${esc(tx ? tx.date : S.boot.today)}">`)}
      ${field('category', '거래구분', `<select required>${options(cats(kind).map(c => c.name).concat(tx && !cats(kind).some(c => c.name === tx.category) ? [tx.category] : []), tx ? tx.category : '', '선택')}</select>`)}
      ${field('description', '내용', `<input maxlength="200" value="${esc(tx?.description)}">`)}
      ${field('partner', '거래처', `<input list="partnerList" maxlength="100" value="${esc(tx?.partner)}">`)}
      ${field('supplyAmount', '금액', `<input inputmode="numeric" required value="${tx ? fmt(tx.supplyAmount) : ''}" placeholder="0">`)}
      <div class="field"><label id="${id}-vat">부가세</label>
        <div class="radios" role="radiogroup" aria-labelledby="${id}-vat">
          <label><input type="radio" name="${id}-vm" value="NONE" ${mode === 'NONE' ? 'checked' : ''}>없음</label>
          <label><input type="radio" name="${id}-vm" value="SEPARATE" ${mode === 'SEPARATE' ? 'checked' : ''}>별도 10%</label>
          <input name="vatAmount" inputmode="numeric" aria-label="부가세 금액" value="${tx ? fmt(tx.vatAmount) : '0'}">
        </div><div class="err" id="${id}-vatAmount-err"></div></div>
      <div class="field"><label>합계</label><output class="total" aria-live="polite">0</output></div>
      ${field('evidence', '증빙', `<select>${options(S.boot.evidence, tx ? tx.evidence : '', '선택 안 함')}</select>`)}
      ${field('memo', '비고', `<input maxlength="200" value="${esc(tx?.memo)}">`)}
      ${kind === 'ASSET' && !compact ? '<p class="note">고정자산매입은 필요경비에 자동 반영되지 않습니다. 감가상각비는 비용으로 따로 입력하세요.</p>' : ''}
      <div class="actions">${tx ? '<button type="button" class="btn" data-close>취소</button>' : ''}<button class="btn primary">${tx ? '수정' : '저장'}</button></div>
    </form>${partnerList()}`;
  function field(name, label, control) {
    const ctl = control.replace(/^<(\w+)/, `<$1 id="${id}-${name}" name="${name}" aria-describedby="${id}-${name}-err"`);
    return `<div class="field"><label for="${id}-${name}">${label}</label>${ctl}<div class="err" id="${id}-${name}-err"></div></div>`;
  }
  const f = $('form', root), el = n => f.elements[n];
  const vm = () => $(`input[name="${id}-vm"]:checked`, f).value;
  let vatTouched = !!tx;
  function recalc(fromSupply) {
    const s = Number(unfmt(el('supplyAmount').value) || 0);
    if (fromSupply || !vatTouched) el('vatAmount').value = fmt(vm() === 'SEPARATE' ? Math.floor(s * 0.1) : 0);
    $('output', f).textContent = fmt(s + Number(unfmt(el('vatAmount').value) || 0)) + '원';
  }
  const money = inp => { const v = unfmt(inp.value); inp.value = v ? fmt(v) : ''; };
  el('supplyAmount').addEventListener('input', e => { money(e.target); vatTouched = false; recalc(true); });
  el('vatAmount').addEventListener('input', e => { money(e.target); vatTouched = true; recalc(); });
  $$(`input[name="${id}-vm"]`, f).forEach(r => r.addEventListener('change', () => { vatTouched = false; recalc(true); }));
  recalc();
  const close = $('[data-close]', f); if (close) close.onclick = () => $('#dlg').close();

  f.addEventListener('submit', async e => {
    e.preventDefault();
    $$('.err', f).forEach(x => x.textContent = ''); $$('[aria-invalid]', f).forEach(x => x.removeAttribute('aria-invalid'));
    const body = {
      kind, date: el('date').value, category: el('category').value, description: el('description').value,
      partner: el('partner').value, supplyAmount: unfmt(el('supplyAmount').value), vatMode: vm(),
      vatAmount: unfmt(el('vatAmount').value), evidence: el('evidence').value, memo: el('memo').value
    };
    const btn = $('button.primary', f); btn.disabled = true;
    try {
      const saved = tx
        ? await call('transactions.update', Object.assign(body, { id: tx.id, expectedUpdatedAt: tx.updatedAt }))
        : await call('transactions.create', Object.assign(body, { requestId }));
      toast(`${KIND[kind]}내역이 ${tx ? '수정' : '입력'}되었습니다.`);
      if (!tx) {  // 다음 입력 준비: 일자·거래구분·증빙은 유지
        requestId = uuid();
        ['description', 'partner', 'supplyAmount', 'memo'].forEach(n => el(n).value = '');
        vatTouched = false; recalc(true);
      }
      onDone && onDone(saved);
    } catch (err) {
      const fields = err.details && err.details.fields;
      if (fields) Object.entries(fields).forEach(([k, m]) => {
        const box = $(`#${id}-${k}-err`, f); if (box) box.textContent = m;
        const inp = el(k); if (inp && inp.setAttribute) inp.setAttribute('aria-invalid', 'true');
      });
      fail(err);
    } finally { btn.disabled = false; }
  });
}

function openTxDialog(tx, onDone) {
  const d = $('#dlg');
  d.innerHTML = `<h2>${KIND[tx.kind]} 수정 <small style="color:var(--muted);font-weight:400">${esc(tx.id)}</small></h2><div></div>`;
  txForm($('div', d), { tx, compact: true, onDone: s => { d.close(); onDone(s); } });
  d.showModal();
}

/* ───────── 대시보드 ───────── */
VIEWS.dashboard = async v => {
  const date = S.dashDate || S.boot.today;
  const [d, es] = await Promise.all([call('reports.dashboard', { year: S.year, date }), call('reports.expenseStatement', { year: S.year })]);
  v.innerHTML = `
    ${warnBanner(es.warnings)}
    <div class="grid3">${KINDS.map(k => `<section class="card ${KCLS[k]}"><h3>${KIND[k]} 입력</h3><div data-form="${k}"></div></section>`).join('')}</div>
    <div class="grid2">
      <section class="card"><h3>${S.year}년 월별</h3>
        <div class="tablewrap" style="border:0"><table class="data"><thead><tr><th>월</th>${KINDS.map(k => `<th class="num">${KIND[k]}</th>`).join('')}</tr></thead>
        <tbody>${d.monthly.map(m => `<tr><td>${m.month}월</td>${KINDS.map(k => `<td class="num">${fmt(m[k])}</td>`).join('')}</tr>`).join('')}
        <tr class="sum"><td>합계</td>${KINDS.map(k => `<td class="num">${fmt(d.yearTotal[k])}</td>`).join('')}</tr></tbody></table></div>
      </section>
      <div style="display:grid;gap:var(--gap);align-content:start">
        <section class="card"><h3>분기별</h3>${bars(d.quarterly)}</section>
        <section class="card"><h3>${S.year}년 / ${S.year - 1}년 비교</h3>
          <table class="data"><thead><tr><th></th>${KINDS.map(k => `<th class="num">${KIND[k]}</th>`).join('')}</tr></thead><tbody>

          ${KINDS.map(k => `<tr><td><span class="badge ${k}">${KIND[k]}</span></td><td class="num">${fmt(d.day[k].supply)}</td><td class="num">${fmt(d.day[k].vat)}</td><td class="num">${fmt(d.day[k].total)}</td><td class="num">${pct(d.day[k].rateVsPrevDay)}</td></tr>`).join('')}

function bars(qs) {
  const max = Math.max(1, ...qs.flatMap(q => KINDS.map(k => q[k])));
  const color = { INCOME: 'var(--income)', EXPENSE: 'var(--expense)', ASSET: 'var(--asset)' };
  return `<div class="legend">${KINDS.map(k => `<span><i style="background:${color[k]}"></i>${KIND[k]}</span>`).join('')}</div>
    <div class="bars" role="img" aria-label="분기별 수입·비용·고정자산매입 막대 그래프">${qs.map(q => `<div class="q"><div class="cols">${KINDS.map(k =>
      `<span style="height:${(q[k] / max * 100).toFixed(1)}%;background:${color[k]}" title="${q.quarter}분기 ${KIND[k]} ${fmt(q[k])}원"></span>`).join('')}</div><small>${q.quarter}Q</small></div>`).join('')}</div>`;
}

function warnBanner(ws) {
  if (!ws || !ws.length) return '';
  const sum = ws.reduce((a, w) => a + w.amount, 0);
  return `<div class="warn" role="alert"><strong>명세서 항목이 지정되지 않은 거래구분 ${ws.length}개(${fmt(sum)}원)가 ${S.year}년 명세서에서 빠져 있습니다.</strong>
    <br>${ws.map(w => `${esc(w.category)} ${fmt(w.amount)}원`).join(' · ')} — <a href="#settings">설정 › 거래구분</a>에서 반영할 항목을 지정하세요.</div>`;
}

/* ───────── 거래 목록(내역관리·거래별 공용) ───────── */
const COLS = [
  ['id', '등록코드'], ['date', '일자'], ['kind', '거래종류'], ['category', '거래구분'], ['description', '내용'],
  ['partner', '거래처'], ['supplyAmount', '공급가액', 1], ['vatAmount', '부가세', 1], ['totalAmount', '합계', 1],
  ['evidence', '증빙'], ['memo', '비고']
];
function txTable(rows, { select, hidden = [] } = {}) {
  const cols = COLS.filter(c => !hidden.includes(c[0]));
  return `<table class="data"><thead><tr>${select ? '<th><input type="checkbox" data-all aria-label="모두 선택"></th>' : ''}<th>No</th>${cols.map(c => `<th class="${c[2] ? 'num' : ''}">${c[1]}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((t, i) => `<tr class="click" data-id="${esc(t.id)}">${select ? `<td><input type="checkbox" data-pick="${esc(t.id)}" aria-label="${esc(t.id)} 선택"></td>` : ''}<td>${i + 1}</td>
      ${cols.map(([k, , n]) => `<td class="${n ? 'num' : ''}">${k === 'kind' ? `<span class="badge ${t.kind}">${KIND[t.kind]}</span>` : n ? fmt(t[k]) : esc(t[k])}</td>`).join('')}</tr>`).join('')
      || `<tr><td colspan="${cols.length + 2}" class="loading">검색 결과가 없습니다.</td></tr>`}</tbody></table>`;
}
function sumRows(sums, kind) {
  const ks = kind ? [kind] : KINDS.filter(k => sums.byKind[k].count);
  return ks.map(k => `<dt><span class="badge ${k}">${KIND[k]}</span> ${fmt(sums.byKind[k].count)}건</dt><dd>공급가액 ${fmt(sums.byKind[k].supply)} · 부가세 ${fmt(sums.byKind[k].vat)} · <strong>합계 ${fmt(sums.byKind[k].total)}원</strong></dd>`).join('');
}
function periodChips(root, onPick) {
  const t = S.boot.today, y = t.slice(0, 4), m = t.slice(0, 7);
  const last = new Date(Number(y), Number(t.slice(5, 7)), 0).getDate();
  const set = (a, b) => { $('[name=from]', root).value = a; $('[name=to]', root).value = b; onPick(); };
  $('[data-today]', root).onclick = () => set(t, t);
  $('[data-month]', root).onclick = () => set(m + '-01', m + '-' + String(last).padStart(2, '0'));
  $('[data-year]', root).onclick = () => set(S.year + '-01-01', S.year + '-12-31');
}
const PERIOD = r => `<input type="date" name="from" aria-label="시작일" value="${r.from}"> ~ <input type="date" name="to" aria-label="종료일" value="${r.to}">
  <button type="button" class="chip" data-today>오늘</button><button type="button" class="chip" data-month>이번 달</button><button type="button" class="chip" data-year>${S.year}년</button>`;

VIEWS.records = async v => {
  const r = yearRange();
  const hidden = store.get('hiddenCols', []);
  v.innerHTML = `<h2>내역관리</h2>
    <form class="toolbar" role="search">
      ${PERIOD(r)}
      <select name="kind" aria-label="거래종류">${'<option value="">전체</option>' + KINDS.map(k => `<option value="${k}">${KIND[k]}</option>`).join('')}</select>
      <select name="qField" aria-label="검색 항목"><option value="category">거래구분</option><option value="description" selected>내용</option><option value="partner">거래처</option><option value="evidence">증빙</option><option value="memo">비고</option></select>
      <input type="search" name="q" aria-label="검색어" placeholder="검색어">
      <label><input type="checkbox" name="exact"> 완전일치</label>
      <button class="btn primary">검색</button>
      <button type="button" class="btn" data-csv>CSV 저장</button>
      <details class="noprint"><summary class="chip">열 표시</summary><div class="colpick">${COLS.map(([k, l]) => `<label><input type="checkbox" data-col="${k}" ${hidden.includes(k) ? '' : 'checked'}> ${l}</label>`).join('')}</div></details>
    </form>
    <dl class="kv card" id="sums" style="margin:0 0 var(--gap)"></dl>
    <div class="tablewrap" id="tbl"></div>
    <div class="pager"><button class="btn danger" data-bulk disabled>선택 삭제</button><span style="flex:1"></span><span id="pg"></span>
      <select id="ps" aria-label="페이지당 건수">${[50, 100, 200].map(n => `<option>${n}</option>`).join('')}</select></div>`;
  const f = $('form', v); let page = 1;
  const params = () => ({ from: f.from.value, to: f.to.value, kind: f.kind.value, qField: f.qField.value, q: f.q.value, exact: f.exact.checked, page, pageSize: Number($('#ps').value) });
  async function load() {
    $('#tbl').innerHTML = '<p class="loading">불러오는 중…</p>';
    const res = await call('transactions.list', params());
    page = res.pagination.page;
    $('#sums').innerHTML = sumRows(res.sums, f.kind.value) || '<dt>합계</dt><dd>0원</dd>';
    $('#tbl').innerHTML = txTable(res.data, { select: true, hidden: store.get('hiddenCols', []) });
    $('#pg').innerHTML = `<button class="btn" ${page <= 1 ? 'disabled' : ''} data-p="-1" aria-label="이전 페이지">◀</button> ${page} / ${res.pagination.totalPages} (${fmt(res.pagination.totalItems)}건) <button class="btn" ${page >= res.pagination.totalPages ? 'disabled' : ''} data-p="1" aria-label="다음 페이지">▶</button>`;
    $$('[data-p]', v).forEach(b => b.onclick = () => { page += Number(b.dataset.p); load().catch(fail); });
    const rows = new Map(res.data.map(t => [t.id, t]));
    $$('#tbl tr.click').forEach(tr => tr.onclick = e => {
      if (e.target.matches('input')) return;
      const tx = rows.get(tr.dataset.id);
      openTxDialog(tx, () => load().catch(fail));
      $('#dlg .actions').insertAdjacentHTML('afterbegin', '<button type="button" class="btn danger" data-del style="margin-right:auto">삭제</button>');
      $('#dlg [data-del]').onclick = async () => {
        if (!confirm(`${tx.id} 거래를 삭제할까요?`)) return;
        try { await call('transactions.delete', { id: tx.id }); $('#dlg').close(); toast('삭제되었습니다.'); load().catch(fail); } catch (er) { fail(er); }
      };
    });
    const picks = () => $$('[data-pick]:checked', v).map(c => c.dataset.pick);
    const syncBulk = () => $('[data-bulk]', v).disabled = !picks().length;
    $$('[data-pick]', v).forEach(c => c.onchange = syncBulk);
    $('[data-all]', v).onchange = e => { $$('[data-pick]', v).forEach(c => c.checked = e.target.checked); syncBulk(); };
    syncBulk();
  }
  f.onsubmit = e => { e.preventDefault(); page = 1; load().catch(fail); };
  $('#ps').onchange = () => { page = 1; load().catch(fail); };
  periodChips(f, () => { page = 1; load().catch(fail); });
  $$('[data-col]', v).forEach(c => c.onchange = () => { store.set('hiddenCols', $$('[data-col]', v).filter(x => !x.checked).map(x => x.dataset.col)); load().catch(fail); });
  $('[data-bulk]', v).onclick = async () => {
    const ids = $$('[data-pick]:checked', v).map(c => c.dataset.pick);
    if (!confirm(`선택한 ${ids.length}건을 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try { const r2 = await call('transactions.bulkDelete', { ids }); toast(`${r2.deletedCount}건 삭제되었습니다.`); load().catch(fail); } catch (er) { fail(er); }
  };
  $('[data-csv]', v).onclick = async () => {
    try {
      const { filename, csv } = await call('export.csv', params());
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    } catch (er) { fail(er); }
  };
  await load();
};

    const f = $('form', d);

  <table class="form" style="border-top:0"><tbody>
    <tr><th rowspan="6" class="vert" style="width:34px">사업장</th><th style="width:150px">(5) 소 재 지</th><td>${esc(h.bizAddress)}</td></tr>
    <tr><th>(6) 업 종</th><td>${esc(h.industry)}</td></tr>
    <tr><th>(7) 주업종코드</th><td>${esc(h.industryCode)}</td></tr>
    <tr><th>(8) 사업자등록번호</th><td>${esc(h.bizNo)}</td></tr>
    <tr><th>(9) 과 세 기 간</th><td>${h.periodFrom} 부터 ${h.periodTo} 까지</td></tr>
    <tr><th>(10) 소 득 종 류</th><td><select aria-label="소득종류" style="border:0;background:none"><option>30</option><option>40</option></select></td></tr>
  </tbody></table>`;
}
function settingsHint(h) {
  return h.ownerName && h.bizNo ? '' : `<div class="warn">인적사항·사업장 정보가 비어 있습니다. <a href="#settings">설정</a>에서 입력하면 서식에 채워집니다.</div>`;
}
/** 편집 칸: 바꾸면 세무조정 값으로 저장하고 서식을 다시 계산 */
function adjInput(key, val) {
  return `<input inputmode="numeric" data-adj="${key}" value="${val ? fmt(val) : ''}" placeholder="0" aria-label="입력 금액">`;
}
function bindAdj(v, again) {
  $$('[data-adj]', v).forEach(inp => {
    inp.oninput = () => { const x = unfmt(inp.value); inp.value = x ? fmt(x) : ''; };
    inp.onchange = async () => {
      try { await call('adjustments.put', { year: S.year, [inp.dataset.adj]: unfmt(inp.value) }); toast('저장되었습니다.'); again(); } catch (e) { fail(e); }
    };
  });
}
const amt = n => `<td class="amt">${fmt(n)}</td>`;

/* ───────── 총수입금액 및 필요경비명세서 ───────── */
VIEWS.expense = async v => {
  const r = await call('reports.expenseStatement', { year: S.year });
  const L = r.lines, a = r.adjustments;
  const G = (n, label) => `<td>${label}</td>${amt(L['L' + n])}`;
  const E = (n, label) => `<td>${label}</td><td class="amt">${adjInput('L' + n, a['L' + n])}</td>`;
  const gen = [[25, '급 료'], [26, '제 세 공 과 금'], [27, '임 차 료'], [28, '지 급 이 자'], [29, '접 대 비'], [30, '기 부 금'], [31, '감 가 상 각 비'],
    [32, '차 량 유 지 비'], [33, '지 급 수 수 료'], [34, '소 모 품 비'], [35, '복 리 후 생 비'], [36, '운 반 비'], [37, '광 고 선 전 비'], [38, '여 비 교 통 비'], [39, '기 타']];
  v.innerHTML = `<div class="toolbar"><button class="btn primary" onclick="print()">인쇄</button><span class="note">점선 칸은 직접 입력하는 금액입니다(재고액). 입력하면 바로 다시 계산됩니다.</span></div>
    ${warnBanner(r.warnings)}${settingsHint(r.header)}
    <article class="form-doc">
      <p class="law">■ 소득세법 시행규칙 [별지 제82호서식 부표] &lt;개정 2021. 3. 16.&gt;</p>
      <p class="title">총수입금액 및 필요경비명세서(${S.year}년 귀속)</p>
      ${formHead(r.header)}
      <table class="form" style="border-top:0"><tbody>
        <tr><th rowspan="3" colspan="2" class="vert">장부상 수입금액</th>${G(11, '(11) 매 출 액')}</tr>
        <tr>${G(12, '(12) 기 타')}</tr>
        <tr class="tot">${G(13, '(13) 수입금액 합계(11+12)')}</tr>
        <tr><th rowspan="28" class="vert">필 요 경 비</th><th rowspan="4" class="vert">매출원가</th>${E(14, '(14) 기초재고액')}</tr>
        <tr>${G(15, '(15) 당기상품매입액 또는 제조비용(24)')}</tr>
        <tr>${E(16, '(16) 기말재고액')}</tr>
        <tr class="tot">${G(17, '(17) 매출원가(14+15-16)')}</tr>
        <tr><th rowspan="7" class="vert">제조비용</th>${E(18, '재료비 (18) 기초 재고액')}</tr>
        <tr>${G(19, '재료비 (19) 당기 매입액')}</tr>
        <tr>${E(20, '재료비 (20) 기말 재고액')}</tr>
        <tr>${G(21, '재료비 (21) 당기 재료비(18+19-20)')}</tr>
        <tr>${G(22, '(22) 노 무 비')}</tr>
        <tr>${G(23, '(23) 경 비')}</tr>
        <tr class="tot">${G(24, '(24) 당기제조비용(21+22+23)')}</tr>
        <tr><th rowspan="16" class="vert">일반관리비등</th>${G(gen[0][0], `(${gen[0][0]}) ${gen[0][1]}`)}</tr>
        ${gen.slice(1).map(([n, l]) => `<tr>${G(n, `(${n}) ${l}`)}</tr>`).join('')}
        <tr class="tot">${G(40, '(40) 일반관리비등계(25~39의 합계)')}</tr>
        <tr class="tot"><td colspan="2">(41) 필요경비 합계(17+40)</td>${amt(L.L41)}</tr>
      </tbody></table>
    </article>`;
  bindAdj(v, () => VIEWS.expense(v).catch(fail));
};

/* ───────── 간편장부소득금액계산서 ───────── */
VIEWS.income = async v => {
  const r = await call('reports.incomeStatement', { year: S.year });
  const L = r.lines, a = r.adjustments;
  const G = (n, label) => `<td>${label}</td>${amt(L['L' + n])}`;
  const E = (key, label) => `<td>${label}</td><td class="amt">${adjInput(key, a[key])}</td>`;
  const today = S.boot.today;
  v.innerHTML = `<div class="toolbar"><button class="btn primary" onclick="print()">인쇄</button><span class="note">점선 칸은 세무조정 금액입니다. 장부상 금액은 명세서(부표)에서 그대로 가져옵니다.</span></div>
    ${warnBanner(r.warnings)}${settingsHint(r.header)}
    <article class="form-doc">
      <p class="law">■ 소득세법 시행규칙 [별지 제82호서식] &lt;개정 2021. 3. 16.&gt;</p>
      <p class="title">간편장부소득금액계산서(${S.year}년 귀속)</p>
      ${formHead(r.header)}
      <table class="form" style="border-top:0"><tbody>
        <tr><th rowspan="4" class="vert" style="width:60px">총수입금액</th>${G(11, '(11) 장부상 수입금액')}</tr>
        <tr>${E('adjIncomeMinus', '(12) 수입금액에서 제외할 금액')}</tr>
        <tr>${E('adjIncomePlus', '(13) 수입금액에 가산할 금액')}</tr>
        <tr class="tot">${G(14, '(14) 세무조정후 수입금액(11-12+13)')}</tr>
        <tr><th rowspan="4" class="vert">필요경비</th>${G(15, '(15) 장부상 필요경비(부표 (41)의 금액)')}</tr>
        <tr>${E('adjExpenseMinus', '(16) 필요경비에서 제외할 금액')}</tr>
        <tr>${E('adjExpensePlus', '(17) 필요경비에 가산할 금액')}</tr>
        <tr class="tot">${G(18, '(18) 세무조정후 필요경비(15-16+17)')}</tr>
        <tr class="tot"><td colspan="2">(19) 차가감 소득금액(14-18)</td>${amt(L.L19)}</tr>
        <tr><td colspan="2">(20) 기부금 한도초과액</td><td class="amt">${adjInput('donationExcess', a.donationExcess)}</td></tr>
        <tr><td colspan="2">(21) 기부금이월액중 필요경비산입액</td><td class="amt">${adjInput('donationCarryover', a.donationCarryover)}</td></tr>
        <tr class="tot"><td colspan="2">(22) 당해연도 소득금액(19+20-21)</td>${amt(L.L22)}</tr>
      </tbody></table>
      <div class="foot">
        <p>「소득세법」 제70조 제4항 제3호 단서 및 같은 법 시행령 제132조에 따라 간편장부소득금액계산서를 제출합니다.</p>
        <p style="text-align:right"><input type="date" value="${today}" aria-label="제출일" style="border:0;font:inherit;text-align:right"></p>
        <div class="sign"><span>제 출 인</span><span style="min-width:140px">${esc(r.header.ownerName)}</span><span>(서명 또는 인)</span>
          <span>세무대리인</span><span></span><span>(서명 또는 인)</span></div>
        <p><strong>세무서장</strong> 귀하</p>
        <table class="form"><tr><th style="width:90px">첨부서류</th><td>총수입금액 및 필요경비명세서(별지 제82호서식 부표) 1부</td><th style="width:80px">수수료<br>없 음</th></tr></table>
      </div>
    </article>`;
  bindAdj(v, () => VIEWS.income(v).catch(fail));
};

/* ───────── 설정 ───────── */
VIEWS.settings = async v => {
  await refreshBoot();
  const s = S.boot.settings;
  const prof = [['ownerName', '성명'], ['birthDate', '생년월일'], ['address', '주소'], ['phone', '전화번호'],
    ['bizName', '상호'], ['bizNo', '사업자등록번호'], ['bizAddress', '사업장 소재지'], ['industry', '업종'], ['industryCode', '주업종코드(6자리)']];
  const lines = S.boot.formLines;
  const lineOpts = (kind, sel) => '<option value="">— 미지정 —</option>' + lines
    .filter(([c]) => kind === 'INCOME' ? ['L11', 'L12'].includes(c) : !['L11', 'L12'].includes(c))
    .map(([c, l]) => `<option value="${c}" ${c === sel ? 'selected' : ''}>${esc(l)}</option>`).join('');
  const catTable = kind => {
    const list = S.boot.categories.filter(c => c.kind === kind);
    return `<section class="card" style="margin-bottom:var(--gap)"><h3><span class="badge ${kind}">${KIND[kind]}</span> 거래구분</h3>
      <div class="tablewrap" style="border:0"><table class="data"><thead><tr><th>이름</th>${kind === 'ASSET' ? '' : '<th>명세서 반영 항목</th>'}<th>사용</th><th>순서</th><th></th></tr></thead><tbody>
      ${list.map((c, i) => `<tr data-name="${esc(c.name)}" data-kind="${kind}">
        <td>${esc(c.name)}</td>
        ${kind === 'ASSET' ? '' : `<td><select data-line aria-label="${esc(c.name)} 명세서 항목" ${c.formLine ? '' : 'aria-invalid="true"'}>${lineOpts(kind, c.formLine)}</select></td>`}
        <td><input type="checkbox" data-active ${c.isActive ? 'checked' : ''} aria-label="${esc(c.name)} 사용"></td>
        <td><button class="btn" data-mv="-1" ${i ? '' : 'disabled'} aria-label="위로">▲</button> <button class="btn" data-mv="1" ${i < list.length - 1 ? '' : 'disabled'} aria-label="아래로">▼</button></td>
        <td><button class="btn" data-rename>이름 변경</button></td></tr>`).join('')}
      </tbody></table></div>
      <form class="toolbar" data-add="${kind}" style="margin:8px 0 0"><input name="name" placeholder="새 거래구분 이름" aria-label="새 거래구분 이름" required maxlength="50">
        ${kind === 'ASSET' ? '' : `<select name="formLine" aria-label="명세서 반영 항목" required>${lineOpts(kind, '')}</select>`}<button class="btn">추가</button></form>
      ${kind === 'ASSET' ? '<p class="note">고정자산매입은 명세서에 반영되지 않습니다(감가상각비로 따로 처리).</p>' : ''}</section>`;
  };
  v.innerHTML = `<h2>설정</h2>
    <div class="grid2" style="margin-top:0">
      <section class="card"><h3>기본정보 · 사업장 정보</h3><form id="prof" novalidate>
        ${prof.map(([k, l]) => `<div class="field" style="grid-template-columns:120px 1fr"><label for="s-${k}">${l}</label><input id="s-${k}" name="${k}" value="${esc(s[k])}" maxlength="200"></div>`).join('')}
        <p class="note">주민등록번호는 저장하지 않습니다. 서식 출력 후 필요하면 직접 적어 주세요.</p>
        <div class="actions"><button class="btn primary">저장</button></div></form></section>
      <section class="card"><h3>부가세 기본값</h3><form id="vat">
        ${KINDS.map(k => `<div class="field" style="grid-template-columns:110px 1fr"><label for="v-${k}">${KIND[k]}</label><select id="v-${k}" name="vatDefault.${k}">
          <option value="NONE" ${s['vatDefault.' + k] !== 'SEPARATE' ? 'selected' : ''}>없음</option><option value="SEPARATE" ${s['vatDefault.' + k] === 'SEPARATE' ? 'selected' : ''}>별도(10%)</option></select></div>`).join('')}
        <p class="note">입력 화면에서 매번 바꿀 수도 있습니다. 면세사업자(교습소 등)는 보통 "없음"입니다.</p>
        <div class="actions"><button class="btn primary">저장</button></div></form></section>
    </div>
    <h2 style="margin-top:20px">거래구분 · 명세서 반영 항목</h2>
    <p class="note" style="margin-top:-8px;margin-bottom:12px">거래구분마다 총수입금액 및 필요경비명세서의 어느 칸에 더할지 정합니다. 미지정이면 명세서에서 빠지고 경고가 표시됩니다. 어느 항목이 맞는지는 세무 판단이므로 확실하지 않으면 세무사와 확인하세요.</p>
    ${KINDS.map(catTable).join('')}`;
  const saveForm = id => $(id, v).onsubmit = async e => {
    e.preventDefault();
    try { await call('settings.update', Object.fromEntries(new FormData(e.target))); await refreshBoot(); toast('저장되었습니다.'); } catch (er) { fail(er); }
  };
  saveForm('#prof'); saveForm('#vat');
  const upd = async (body, msg) => { try { await call('categories.update', body); toast(msg || '저장되었습니다.'); VIEWS.settings(v).catch(fail); } catch (e) { fail(e); VIEWS.settings(v).catch(fail); } };
  $$('tr[data-name]', v).forEach(tr => {
    const base = { kind: tr.dataset.kind, name: tr.dataset.name };
    const sel = $('[data-line]', tr); if (sel) sel.onchange = () => upd({ ...base, formLine: sel.value });
    $('[data-active]', tr).onchange = e => upd({ ...base, isActive: e.target.checked });
    $('[data-rename]', tr).onclick = () => {
      const n = prompt(`'${base.name}'의 새 이름 (지난 거래 내역도 함께 바뀝니다)`, base.name);
      if (n && n.trim() && n.trim() !== base.name) upd({ ...base, newName: n.trim() }, '이름이 바뀌었습니다.');
    };
    $$('[data-mv]', tr).forEach(b => b.onclick = async () => {
      const list = S.boot.categories.filter(c => c.kind === base.kind);
      const i = list.findIndex(c => c.name === base.name), j = i + Number(b.dataset.mv);
      list.splice(j, 0, list.splice(i, 1)[0]);
      try { for (let k = 0; k < list.length; k++) if (list[k].sortOrder !== k + 1) await call('categories.update', { kind: base.kind, name: list[k].name, sortOrder: k + 1 }); }
      catch (e) { fail(e); }
      VIEWS.settings(v).catch(fail);
    });
  });
  $$('[data-add]', v).forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    try { await call('categories.create', { kind: f.dataset.add, name: f.elements['name'].value, formLine: f.elements.formLine ? f.elements.formLine.value : '' }); toast('추가되었습니다.'); VIEWS.settings(v).catch(fail); } catch (er) { fail(er); }
  });
};

boot();
</script>
</body>
</html>
